name: Publish encrypted downloads
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing snapshot.json and three encrypted archives
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: downloads-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download encrypted release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --dir release-assets --pattern 'snapshot.json' --pattern '*.tar.gz.gpg'
      - name: Verify assets and build page
        run: python3 scripts/build_download_page.py --assets release-assets --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
